<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>幸运大转盘</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f4ff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .container {
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 4px 32px rgba(83,74,183,.12);
      padding: 32px;
      max-width: 820px;
      width: 100%;
    }
    h1 {
      text-align: center;
      font-size: 22px;
      font-weight: 500;
      color: #3C3489;
      margin-bottom: 28px;
      letter-spacing: 2px;
    }
    .layout {
      display: grid;
      grid-template-columns: 340px 1fr;
      gap: 28px;
      align-items: start;
    }
    .wheel-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }
    .pointer {
      width: 0; height: 0;
      border-left: 13px solid transparent;
      border-right: 13px solid transparent;
      border-top: 30px solid #E24B4A;
      filter: drop-shadow(0 2px 4px rgba(226,75,74,.3));
    }
    canvas { border-radius: 50%; display: block; }
    .spin-btn {
      padding: 11px 36px;
      font-size: 15px;
      font-weight: 500;
      background: #534AB7;
      color: #fff;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: background .15s, transform .1s;
      letter-spacing: 1px;
    }
    .spin-btn:hover { background: #3C3489; }
    .spin-btn:active { transform: scale(.97); }
    .spin-btn:disabled { opacity: .4; cursor: not-allowed; transform: none; }
    .result-box {
      display: none;
      background: #f5f4ff;
      border-radius: 12px;
      padding: 16px 20px;
      text-align: center;
      border-top: 3px solid #534AB7;
      width: 100%;
    }
    .result-label { font-size: 12px; color: #888; margin-bottom: 6px; }
    .result-name { font-size: 22px; font-weight: 500; color: #26215C; }
    /* Panel */
    .panel { display: flex; flex-direction: column; gap: 12px; }
    .panel h3 { font-size: 14px; font-weight: 500; color: #333; }
    .add-row { display: flex; gap: 8px; }
    .add-row input {
      flex: 1;
      padding: 8px 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 13px;
      outline: none;
      transition: border-color .15s;
    }
    .add-row input:focus { border-color: #534AB7; }
    .add-row button {
      padding: 8px 16px;
      font-size: 13px;
      background: #f0effc;
      border: 1px solid #c5c1f0;
      border-radius: 8px;
      cursor: pointer;
      color: #534AB7;
      font-weight: 500;
      transition: background .15s;
    }
    .add-row button:hover { background: #e0dffa; }
    .items-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 340px;
      overflow-y: auto;
      padding-right: 2px;
    }
    .item-row {
      background: #fafafa;
      border: 1px solid #eee;
      border-radius: 8px;
      padding: 9px 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .item-color { width: 12px; height: 12px; border-radius: 3px; flex-shrink: 0; }
    .item-name { font-size: 13px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #333; }
    .item-pct { font-size: 12px; color: #888; width: 36px; text-align: right; flex-shrink: 0; }
    .item-weight { width: 72px; flex-shrink: 0; accent-color: #534AB7; cursor: pointer; }
    .del-btn {
      background: none; border: none; cursor: pointer;
      color: #bbb; font-size: 13px; padding: 2px 5px; border-radius: 4px; flex-shrink: 0;
      transition: color .15s;
    }
    .del-btn:hover { color: #E24B4A; }
    .hint { font-size: 12px; color: #aaa; margin-top: 2px; }
    @media (max-width: 680px) {
      .layout { grid-template-columns: 1fr; }
      .wheel-wrap canvas { width: 260px !important; height: 260px !important; }
    }
  </style>
</head>
<body>
<div class="container">
  <h1>幸运大转盘</h1>
  <div class="layout">
    <!-- 转盘区域 -->
    <div class="wheel-wrap">
      <div class="pointer"></div>
      <canvas id="wc" width="300" height="300"></canvas>
      <button class="spin-btn" id="spinBtn" onclick="spin()">开始转动</button>
      <div class="result-box" id="resultBox">
        <div class="result-label">恭喜获得</div>
        <div class="result-name" id="resultName">—</div>
      </div>
    </div>
    <!-- 编辑面板 -->
    <div class="panel">
      <h3>添加条目</h3>
      <div class="add-row">
        <input id="newName" placeholder="输入奖项名称（最多10字）" maxlength="10"
               onkeydown="if(event.key==='Enter')addItem()"/>
        <button onclick="addItem()">添加</button>
      </div>
      <h3 style="margin-top:6px">
        条目列表
        <span id="totalInfo" style="font-size:12px;font-weight:400;color:#888"></span>
      </h3>
      <div class="items-list" id="itemsList"></div>
      <p class="hint">拖动滑块调节权重（1-100），权重越大概率越高</p>
    </div>
  </div>
</div>

<script>
const COLORS = [
  '#534AB7','#D85A30','#1D9E75','#D4537E',
  '#378ADD','#BA7517','#639922','#A32D2D',
  '#0F6E56','#993C1D','#185FA5','#888780'
];

let items = [
  { name: '一等奖', weight: 5  },
  { name: '二等奖', weight: 10 },
  { name: '三等奖', weight: 20 },
  { name: '参与奖', weight: 40 },
  { name: '再来一次', weight: 25 },
];
let spinning = false;
let currentAngle = 0;

function totalWeight() {
  return items.reduce((s, i) => s + i.weight, 0);
}

function drawWheel(extra = 0) {
  const canvas = document.getElementById('wc');
  const ctx = canvas.getContext('2d');
  const cx = 150, cy = 150, r = 142;
  ctx.clearRect(0, 0, 300, 300);
  const total = totalWeight();

  if (!items.length) {
    ctx.fillStyle = '#eee';
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#888';
    ctx.font = '13px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('暂无条目', cx, cy);
    return;
  }

  let startA = extra - Math.PI / 2;
  items.forEach((item, i) => {
    const slice = (item.weight / total) * Math.PI * 2;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.arc(cx, cy, r, startA, startA + slice);
    ctx.closePath();
    ctx.fillStyle = COLORS[i % COLORS.length];
    ctx.fill();
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 2;
    ctx.stroke();

    // 文字
    const mid = startA + slice / 2;
    const tx = cx + Math.cos(mid) * (r * 0.65);
    const ty = cy + Math.sin(mid) * (r * 0.65);
    ctx.save();
    ctx.translate(tx, ty);
    ctx.rotate(mid + Math.PI / 2);
    ctx.fillStyle = '#fff';
    ctx.font = '500 12px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    const n = item.name.length > 6 ? item.name.slice(0, 6) + '…' : item.name;
    ctx.fillText(n, 0, 0);
    ctx.restore();

    startA += slice;
  });

  // 中心圆
  ctx.beginPath();
  ctx.arc(cx, cy, 16, 0, Math.PI * 2);
  ctx.fillStyle = '#fff';
  ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,.08)';
  ctx.lineWidth = 1;
  ctx.stroke();
}

function renderList() {
  const total = totalWeight();
  const list = document.getElementById('itemsList');
  list.innerHTML = '';
  items.forEach((item, i) => {
    const pct = total ? Math.round(item.weight / total * 100) : 0;
    const row = document.createElement('div');
    row.className = 'item-row';
    row.innerHTML =
      '<div class="item-color" style="background:' + COLORS[i % COLORS.length] + '"></div>' +
      '<span class="item-name" title="' + item.name + '">' + item.name + '</span>' +
      '<span class="item-pct">' + pct + '%</span>' +
      '<input class="item-weight" type="range" min="1" max="100" value="' + item.weight +
        '" oninput="changeWeight(' + i + ', this.value)"/>' +
      '<button class="del-btn" onclick="removeItem(' + i + ')" title="删除">✕</button>';
    list.appendChild(row);
  });
  document.getElementById('totalInfo').textContent = '（共 ' + items.length + ' 项）';
  drawWheel(currentAngle);
}

function addItem() {
  const inp = document.getElementById('newName');
  const name = inp.value.trim();
  if (!name) return;
  items.push({ name, weight: 20 });
  inp.value = '';
  renderList();
}

function removeItem(i) {
  if (items.length <= 1) { alert('至少保留一个条目'); return; }
  items.splice(i, 1);
  renderList();
}

function changeWeight(i, v) {
  items[i].weight = parseInt(v);
  renderList();
}

function spin() {
  if (spinning || !items.length) return;
  spinning = true;
  document.getElementById('spinBtn').disabled = true;
  document.getElementById('resultBox').style.display = 'none';

  const total = totalWeight();
  let rnd = Math.random() * total;
  let picked = items.length - 1;
  for (let i = 0; i < items.length; i++) {
    rnd -= items[i].weight;
    if (rnd <= 0) { picked = i; break; }
  }

  // slices 从 -π/2 开始，与 drawWheel 保持一致
  let slices = [-Math.PI / 2];
  items.forEach((item, i) => {
    slices.push(slices[i] + (item.weight / total) * Math.PI * 2);
  });
  const mid = slices[picked] + (slices[picked + 1] - slices[picked]) / 2;
  const extraSpins = Math.PI * 2 * (6 + Math.floor(Math.random() * 4));
  const startA = currentAngle;
  // 基于当前角度计算到达目标的增量
  const desired = -Math.PI / 2 - mid;
  let delta = (desired - startA) % (Math.PI * 2);
  if (delta < 0) delta += Math.PI * 2;
  const targetAngle = extraSpins + delta;
  const duration = 4200;
  const t0 = performance.now();

  function animate(now) {
    const elapsed = now - t0;
    const t = Math.min(elapsed / duration, 1);
    const ease = 1 - Math.pow(1 - t, 4);
    currentAngle = startA + targetAngle * ease;
    drawWheel(currentAngle);
    if (t < 1) {
      requestAnimationFrame(animate);
    } else {
      // 归一化 currentAngle，防止多次旋转后累积误差
      currentAngle = currentAngle % (Math.PI * 2);
      spinning = false;
      document.getElementById('spinBtn').disabled = false;
      const box = document.getElementById('resultBox');
      box.style.display = 'block';
      box.style.borderTopColor = COLORS[picked % COLORS.length];
      document.getElementById('resultName').textContent = items[picked].name;
    }
  }
  requestAnimationFrame(animate);
}

renderList();
</script>
</body>
</html>
